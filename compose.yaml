services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      KVIZUP_PRIVATE_DIR: /var/lib/kvizup
    volumes:
      - ./index.html:/var/www/html/index.html:ro
      - ./app.js:/var/www/html/app.js:ro
      - ./data:/var/www/html/data
      - ./assets:/var/www/html/assets:ro
      - ./admin:/var/www/html/admin:ro
      - ./.env:/var/www/html/.env:ro
      - admin_private:/var/lib/kvizup
  styles:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /workspace
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run styles:watch"]
    volumes:
      - .:/workspace
      - styles_node_modules:/workspace/node_modules

volumes:
  styles_node_modules:
  admin_private:
